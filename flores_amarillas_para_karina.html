<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Etiquetas Open Graph para vista previa en WhatsApp -->
    <meta property="og:title" content="Para mi hermosa Karina 🌻">
    <meta property="og:description" content="Un detalle especial para ti, con mucho amor. ¡Feliz 21 de Septiembre!">
    <meta property="og:image" content="https://placehold.co/600x400/1a1a2e/ffd700?text=Flores+Amarillas+Para+Ti">
    <meta property="og:type" content="website">

    <title>Flores Amarillas para Karina</title>

    <!-- Fuentes elegantes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #2b1055 0%, #000022 100%);
            font-family: 'Montserrat', sans-serif;
            color: white;
            /* Evitar selecciones en dispositivos móviles */
            -webkit-user-select: none;
            user-select: none;
        }

        /* Contenedor del lienzo de animación */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Contenedor del mensaje central */
        .message-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2;
            width: 90%;
            max-width: 500px;
            pointer-events: none; /* Permite tocar las flores a través del texto */
        }

        /* Estilos del texto */
        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #FFD700;
            text-shadow: 0 0 15px rgba(33, 28, 1, 0.6), 0 0 30px rgba(33, 28, 1, 0.6);
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeInDown 2s ease forwards 0.5s;
        }

        h2 {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #FFF3E0;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInUp 2s ease forwards 1.5s;
        }

        .heart {
            font-size: 2rem;
            color: #ff4d4d;
            opacity: 0;
            animation: fadeIn 1s forwards 2.5s, pulse 1.5s infinite 2.5s;
            filter: drop-shadow(0 0 10px rgba(255, 77, 77, 0.8));
        }

        /* Animaciones CSS */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Ajustes responsivos para pantallas pequeñas */
        @media (max-width: 400px) {
            h1 { font-size: 2.8rem; }
            h2 { font-size: 1rem; }
        }

        /* Texto de ayuda inferior */
        .hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            z-index: 2;
            opacity: 0;
            animation: fadeIn 2s forwards 4s;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="magicCanvas"></canvas>
    </div>

    <div class="message-container">
        <h1>Para Karina, el amor de mi vida</h1>
        <h2>Feliz 21 de Septiembre</h2>
        <div class="heart">❤️</div>
    </div>

    <div class="hint">Toca la pantalla para crear más magia ✨</div>

    <script>
        const canvas = document.getElementById('magicCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        const MAX_PARTICLES = 60; // Optimizado para móviles

        // Ajustar tamaño del canvas a la pantalla
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        class Flower {
            constructor(x, y, isInteractive = false) {
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * -height;
                this.size = Math.random() * 15 + 10; // Tamaño de la flor
                this.speedY = Math.random() * 1.5 + 0.5; // Velocidad de caída
                this.speedX = (Math.random() - 0.5) * 1; // Balanceo
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.05; // Rotación
                this.petals = Math.floor(Math.random() * 3) + 5; // 5 a 7 pétalos
                
                // Variaciones sutiles de amarillo a naranja
                const hues = [45, 50, 55]; 
                this.hue = hues[Math.floor(Math.random() * hues.length)];
                
                // Si fue creada por toque, explota un poco
                if (isInteractive) {
                    this.speedY = (Math.random() - 0.5) * 5;
                    this.speedX = (Math.random() - 0.5) * 5;
                }
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y * 0.02) * 0.5; // Efecto de viento suave
                this.angle += this.spin;

                // Reiniciar si sale de la pantalla
                if (this.y > height + this.size) {
                    this.y = -this.size;
                    this.x = Math.random() * width;
                }
                if (this.x > width + this.size) this.x = -this.size;
                if (this.x < -this.size) this.x = width + this.size;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Brillo mágico
                ctx.shadowBlur = 10;
                ctx.shadowColor = `hsla(${this.hue}, 100%, 50%, 0.8)`;

                // Dibujar pétalos
                ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
                for (let i = 0; i < this.petals; i++) {
                    ctx.rotate((Math.PI * 2) / this.petals);
                    ctx.beginPath();
                    // Forma del pétalo alargada
                    ctx.ellipse(0, this.size / 1.5, this.size / 4, this.size / 1.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Dibujar centro (marrón/naranja oscuro)
                ctx.beginPath();
                ctx.arc(0, 0, this.size / 3, 0, Math.PI * 2);
                ctx.fillStyle = "#8B4513";
                ctx.shadowBlur = 0; // Quitar sombra para el centro
                ctx.fill();

                ctx.restore();
            }
        }

        // Partículas mágicas pequeñas (luciérnagas)
        class Firefly {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 1;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random();
                this.fade = (Math.random() * 0.02) + 0.01;
                this.fadeDir = 1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                // Parpadeo
                this.opacity += this.fade * this.fadeDir;
                if(this.opacity >= 1) this.fadeDir = -1;
                if(this.opacity <= 0) {
                    this.fadeDir = 1;
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 150, ${this.opacity})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = "#FFFF99";
                ctx.fill();
            }
        }

        let fireflies = [];

        function init() {
            particles = [];
            fireflies = [];
            for (let i = 0; i < MAX_PARTICLES; i++) {
                particles.push(new Flower());
            }
            for (let i = 0; i < 30; i++) {
                fireflies.push(new Firefly());
            }
        }

        function animate() {
            // Fondo con ligera transparencia para efecto de estela
            ctx.fillStyle = 'rgba(0, 0, 20, 0.3)';
            ctx.fillRect(0, 0, width, height);

            fireflies.forEach(firefly => {
                firefly.update();
                firefly.draw();
            });

            particles.forEach(flower => {
                flower.update();
                flower.draw();
            });

            requestAnimationFrame(animate);
        }

        // Interacción: crear flores al tocar/hacer clic
        function spawnFlowersAtTouch(e) {
            let touchX = e.clientX || (e.touches && e.touches[0].clientX);
            let touchY = e.clientY || (e.touches && e.touches[0].clientY);
            
            if(touchX !== undefined && touchY !== undefined) {
                // Agregar 3-4 flores donde se toca
                for(let i=0; i<4; i++){
                    particles.push(new Flower(touchX, touchY, true));
                }
                // Limitar cantidad total para evitar sobrecarga en móviles
                if(particles.length > MAX_PARTICLES + 20) {
                    particles.splice(0, 4);
                }
            }
        }

        window.addEventListener('click', spawnFlowersAtTouch);
        window.addEventListener('touchstart', spawnFlowersAtTouch, {passive: true});

        // Iniciar todo una vez que cargue la ventana
        window.onload = () => {
            init();
            animate();
        };
    </script>
</body>
</html>
